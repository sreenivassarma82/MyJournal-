<style>
:root{--bg:#faf8f4;--fg:#1f1d1a;--mut:#6f6a62;--card:#fff;--line:#e4dfd6;--acc:#2f5d50;--accfg:#fff;--paper:#fffdf7;--rule:#ebe4d2;--marg:#e0a3a3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--fg:#ece8df;--mut:#9b958a;--card:#211f1b;--line:#37342e;--acc:#6fb39f;--accfg:#10201b;--paper:#1f1d19;--rule:#2d2a24;--marg:#7a4a4a}}
:root[data-theme="dark"]{--bg:#171613;--fg:#ece8df;--mut:#9b958a;--card:#211f1b;--line:#37342e;--acc:#6fb39f;--accfg:#10201b;--paper:#1f1d19;--rule:#2d2a24;--marg:#7a4a4a}
*{box-sizing:border-box}html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 52px);height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,'Times New Roman',serif;height:100%;display:flex;flex-direction:column}

#topbar{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--line);z-index:6;flex:0 0 auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

input,select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;max-width:100%}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;flex:0 0 auto}

.jbody{min-height:120px;outline:none;overflow-wrap:anywhere;line-height:28px;background:repeating-linear-gradient(transparent 0 27px,var(--rule) 27px 28px) local;padding-top:2px}

.jstatus{font-size:12px;color:var(--mut)}
.jcard details{margin-top:10px}
.jempty{text-align:center;color:var(--mut);padding:30px 10px}
#loadMore{display:block;margin:6px auto 0;}
#toolbar{position:sticky;bottom:0;display:none;gap:6px;flex-wrap:wrap;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);z-index:6}
#toolbar.show{display:flex}
#settingsPanel{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;align-items:flex-start;justify-content:center}

#settingsBox{background:var(--card);border-radius:0 0 12px 12px;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;max-height:90vh;overflow-y:auto;margin-top:env(safe-area-inset-top,0px)}

</style></head><body>

<div id="odPicker" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;align-items:center;justify-content:center">
 <div style="background:var(--card);border-radius:10px;padding:14px;max-width:440px;width:92%;max-height:78vh;display:flex;flex-direction:column">
  <div class="row" style="justify-content:space-between;margin-bottom:8px">
   <b id="odPickerPath" style="font-size:14px">My files</b>

<datalist id="logs"></datalist>

 <div id="up"></div>

 <button data-c="bold"><b>B</b></button><button data-c="italic"><i>I</i></button><button data-c="underline"><u>U</u></button>
 <button data-c="insertUnorderedList">• List</button><button data-c="formatBlock" data-v="h3">Heading</button><button data-c="undo">↶</button>
 <button id="mic">🎤 Dictate</button>
</div>

<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
let entries=[],store=null,dl=null,activeId=null,started=false,hiddenAt=0;
const alerted=new Set();
const cardEls=new Map(); // entry id -> {root, body, statusEl, headEl, badgeEl}
const cardTimers={},cardDirty={},lastActivityByCard={};
const nid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toLocaleDateString('en-CA');
const phId=()=>'placeholder-'+today();
const plain=h=>{const d=document.createElement('div');d.innerHTML=h||'';return d.textContent};
function toast(m,ms=5000){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',ms)}

function localStore(){const K='journal:entries';
 const rd=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}};
 const wr=a=>{try{localStorage.setItem(K,JSON.stringify(a))}catch(e){toast('Could not save on this device')}};
 return{label:'Saved on this device only (private sync unavailable in this view)',
  sub(cb){cb(rd())},save(e){const a=rd().filter(x=>x.id!==e.id);a.push(e);wr(a)},del(id){wr(rd().filter(x=>x.id!==id))}}}

/* ---- optional: sync to OneDrive (works on Android + desktop; needs a one-time app registration) ----
   Uses a full-page redirect for sign-in rather than a popup: installed/standalone
   PWAs on Android often have no browser chrome for a popup to open into, so
   loginPopup() reliably fails there even though it can work in a normal tab. A
   redirect just navigates the same window to Microsoft's sign-in page and back. */
let usingOneDrive=false;
const MSAL_CLIENT_ID='a7a9fd63-c793-4852-b8e3-3c867f755497';
const OD_SCOPES=['Files.ReadWrite'];
const msalInstance=(window.msal&&MSAL_CLIENT_ID)?new msal.PublicClientApplication({
 auth:{clientId:MSAL_CLIENT_ID,authority:'https://login.microsoftonline.com/common',redirectUri:location.origin+location.pathname,navigateToLoginRequestUrl:true},
 cache:{cacheLocation:'localStorage',storeAuthStateInCookie:true}}):null;
async function odSilentToken(){
 if(!msalInstance)throw new Error('OneDrive sign-in isn’t available in this browser view.');
 const accts=msalInstance.getAllAccounts();
 if(!accts.length)throw new Error('not signed in');
 return(await msalInstance.acquireTokenSilent({scopes:OD_SCOPES,account:accts[0]})).accessToken}
async function odErrDetail(r){let d='';try{const j=await r.json();d=j.error&&j.error.message||JSON.stringify(j)}catch(e){try{d=await r.text()}catch(e2){}}return d.slice(0,300)}
let odApprootId=null;
async function odApproot(token){
 if(odApprootId)return odApprootId;
 const r=await fetch('https://graph.microsoft.com/v1.0/me/drive/special/approot',{headers:{Authorization:'Bearer '+token}});
 if(!r.ok)throw new Error('Could not access the OneDrive app folder ('+r.status+'): '+await odErrDetail(r));
 odApprootId=(await r.json()).id;return odApprootId}
function odHasChosenFolder(){return localStorage.getItem('journal:onedrive-folder-set')==='1'}
function odChosenFolderId(){return localStorage.getItem('journal:onedrive-folder-id')||''}
function odFolderName(){return odHasChosenFolder()?(localStorage.getItem('journal:onedrive-folder-name')||'My files'):'private app folder'}
async function odFileUrl(token){
 if(odHasChosenFolder()){
  const fid=odChosenFolderId();
  return fid?'https://graph.microsoft.com/v1.0/me/drive/items/'+fid+':/journal-data.json:/content'
            :'https://graph.microsoft.com/v1.0/me/drive/root:/journal-data.json:/content'}
 return'https://graph.microsoft.com/v1.0/me/drive/items/'+await odApproot(token)+':/journal-data.json:/content'}
async function odListFolders(token,folderId){
 const url=folderId?'https://graph.microsoft.com/v1.0/me/drive/items/'+folderId+'/children?$select=id,name,folder&$top=200'
                   :'https://graph.microsoft.com/v1.0/me/drive/root/children?$select=id,name,folder&$top=200';
 const r=await fetch(url,{headers:{Authorization:'Bearer '+token}});
 if(!r.ok)throw new Error('Could not list folders ('+r.status+'): '+await odErrDetail(r));
 const d=await r.json();return(d.value||[]).filter(it=>it.folder).sort((a,b)=>a.name.localeCompare(b.name))}
let odPickerStack=[];
async function odOpenPicker(){
 let token=await odSilentToken().catch(()=>null);
 if(!token){
  if(!msalInstance)return toast('OneDrive sign-in isn’t available in this browser view.');
  try{flushAll();await msalInstance.loginRedirect({scopes:OD_SCOPES});}catch(e){toast('Could not sign in: '+e.message)}
  return; // page is navigating away to sign in; tap "Choose OneDrive folder" again once back
 }
 odPickerStack=[{id:'',name:'My files'}];
 $('#odPicker').style.display='flex';
 await odRenderPicker(token)}
async function odRenderPicker(token){
 const cur=odPickerStack[odPickerStack.length-1];
 $('#odPickerPath').textContent=odPickerStack.map(s=>s.name).join(' / ');
 $('#odPickerUpBtn').style.display=odPickerStack.length>1?'':'none';
 const list=$('#odPickerList');list.innerHTML='<div class="small" style="padding:10px">Loading…</div>';
 try{
  const folders=await odListFolders(token,cur.id||null);
  list.innerHTML=folders.length?'':'<div class="small" style="padding:10px">No subfolders here.</div>';
  folders.forEach(f=>{const row=document.createElement('div');row.textContent='📁 '+f.name;
   row.style.cssText='padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer';
   row.onclick=async()=>{odPickerStack.push({id:f.id,name:f.name});await odRenderPicker(token)};
   list.appendChild(row)})
 }catch(e){list.innerHTML='<div class="small" style="padding:10px">'+e.message+'</div>'}}
$('#odPickerUpBtn').onclick=async()=>{odPickerStack.pop();const t=await odSilentToken().catch(()=>null);if(t)await odRenderPicker(t)};
$('#odPickerClose').onclick=()=>{$('#odPicker').style.display='none'};
$('#odChooseFolder').onclick=odOpenPicker;
$('#odPickerUse').onclick=async()=>{
 const cur=odPickerStack[odPickerStack.length-1],path=odPickerStack.map(s=>s.name).join(' / ');
 $('#odPicker').style.display='none';
 try{
  const token=await odSilentToken();
  localStorage.setItem('journal:onedrive-folder-set','1');
  localStorage.setItem('journal:onedrive-folder-id',cur.id||'');
  localStorage.setItem('journal:onedrive-folder-name',path);
  const existing=await odRead(token),merged=existing.slice();
  entries.forEach(le=>{if(!merged.some(x=>x.id===le.id))merged.push(le)});
  await odWrite(merged,token);entries=merged;store=oneDriveStore();usingOneDrive=true;usingFolder=false;
  localStorage.setItem('journal:onedrive-connected','1');$('#mode').textContent=store.label;
  renderFeed();toast('Now saving to OneDrive: '+path)
 }catch(e){toast('Could not switch folder: '+e.message)}}
async function odRead(token){const t=token||await odSilentToken().catch(()=>null);if(!t)return[];
 const r=await fetch(await odFileUrl(t),{headers:{Authorization:'Bearer '+t}});
 if(r.status===404)return[];if(!r.ok)throw new Error('OneDrive read failed ('+r.status+'): '+await odErrDetail(r));
 const d=await r.json();return Array.isArray(d)?d:Array.isArray(d.entries)?d.entries:[]}
async function odWrite(list,token){const t=token||await odSilentToken();
 const r=await fetch(await odFileUrl(t),{method:'PUT',headers:{Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify({app:'journal',version:1,exported:new Date().toISOString(),entries:list})});
 if(!r.ok)throw new Error('OneDrive save failed ('+r.status+'): '+await odErrDetail(r))}
function oneDriveStore(){return{label:'Synced to OneDrive ('+odFolderName()+') — same data on phone and desktop',
 sub:async cb=>{try{cb(await odRead())}catch(e){toast('OneDrive: '+e.message)}},
 save:()=>odWrite(entries).catch(e=>toast('OneDrive save failed: '+e.message)),
 del:()=>odWrite(entries).catch(e=>toast('OneDrive save failed: '+e.message))}}
async function odFinishConnect(token){
 const existing=await odRead(token),merged=existing.slice();
 entries.forEach(le=>{if(!merged.some(x=>x.id===le.id))merged.push(le)});
 await odWrite(merged,token);entries=merged;store=oneDriveStore();usingOneDrive=true;usingFolder=false;
 localStorage.setItem('journal:onedrive-connected','1');$('#mode').textContent=store.label;
 $('#odConnect').textContent='☁️ OneDrive connected ✓';$('#odDisconnect').style.display='';
 $('#fsStop')&&($('#fsStop').style.display='none');
 renderFeed()}
$('#odConnect').onclick=async()=>{
 if(!msalInstance)return toast('OneDrive sign-in isn’t available in this browser view.');
 const accts=msalInstance.getAllAccounts();
 if(accts.length){
  try{await odFinishConnect(await odSilentToken());return}
  catch(e){/* cached sign-in doesn't cover a scope we need (e.g. a newly added permission) — fall through and ask interactively below */}
 }
 try{
  flushAll(); // flush any in-progress card before we navigate away
  await msalInstance.loginRedirect({scopes:OD_SCOPES}); // navigates away; resumes in odAutoInit on return
 }catch(e){toast('Could not connect OneDrive: '+e.message)}};
$('#odDisconnect').onclick=()=>{usingOneDrive=false;localStorage.removeItem('journal:onedrive-connected');
 try{localStorage.setItem('journal:entries',JSON.stringify(entries))}catch(e){}
 store=localStore();$('#mode').textContent=store.label;
 $('#odDisconnect').style.display='none';$('#odConnect').textContent='☁️ Connect OneDrive';
 toast('Disconnected — your OneDrive file is untouched.')};
async function odAutoInit(){
 if(!msalInstance){$('#odConnect').disabled=true;$('#odConnect').title='OneDrive sign-in isn’t available in this browser view.';return}
 try{
  const result=await msalInstance.handleRedirectPromise(); // completes a loginRedirect that just returned, if any
  if(result&&result.accessToken){await odFinishConnect(result.accessToken);return}
 }catch(e){toast('OneDrive sign-in failed: '+e.message);return}
 if(localStorage.getItem('journal:onedrive-connected')!=='1')return;
 try{await odFinishConnect(await odSilentToken())}
 catch(e){toast('OneDrive didn’t reconnect automatically: '+e.message+' — tap Connect OneDrive to redo it.',9000)}}

/* ---- optional: save/load from a local folder you choose (File System Access API) ---- */
let fsHandle=null,usingFolder=false;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('journal-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function fsSaveHandle(h){try{const db=await idbOpen();await new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(h,'dir');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}}
async function fsLoadHandle(){try{const db=await idbOpen();return await new Promise(res=>{const tx=db.transaction('kv','readonly');const rq=tx.objectStore('kv').get('dir');rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>res(null)})}catch(e){return null}}
async function fsClearHandle(){try{const db=await idbOpen();db.transaction('kv','readwrite').objectStore('kv').delete('dir')}catch(e){}}
async function fsReadFile(handle){try{const fh=await handle.getFileHandle('journal-data.json',{create:true});const text=await(await fh.getFile()).text();if(!text.trim())return[];const data=JSON.parse(text);return Array.isArray(data)?data:Array.isArray(data.entries)?data.entries:[]}catch(e){toast('Could not read the folder file: '+e.message);return[]}}
async function fsWriteFile(handle,list){const fh=await handle.getFileHandle('journal-data.json',{create:true});const w=await fh.createWritable();await w.write(JSON.stringify({app:'journal',version:1,exported:new Date().toISOString(),entries:list}));await w.close()}
function folderStore(handle){return{label:'Saving to folder “'+(handle.name||'Journal')+'” on this device',
 sub:async cb=>cb(await fsReadFile(handle)),save:()=>fsWriteFile(handle,entries),del:()=>fsWriteFile(handle,entries)}}
async function fsConnect(handle){usingOneDrive=false;const existing=await fsReadFile(handle);const merged=existing.slice();
 entries.forEach(le=>{if(!merged.some(x=>x.id===le.id))merged.push(le)});
 await fsWriteFile(handle,merged);entries=merged;store=folderStore(handle);usingFolder=true;
 $('#mode').textContent=store.label;await fsSaveHandle(handle);renderFeed();
 $('#fsChoose').textContent='📁 Change folder…';$('#fsStop').style.display='';$('#fsReconnect').style.display='none'}
async function fsInit(){
 if(!window.showDirectoryPicker){$('#fsChoose').disabled=true;$('#fsChoose').title='Not supported in this browser — choosing a folder needs Chrome or Edge, opened in its own tab (not embedded).';return}
 const saved=await fsLoadHandle();if(!saved)return;
 try{const perm=await saved.queryPermission({mode:'readwrite'});
  if(perm==='granted'){fsHandle=saved;await fsConnect(saved)}
  else{fsHandle=saved;$('#fsReconnect').style.display=''}
 }catch(e){}
}
$('#fsChoose').onclick=async()=>{
 if(!window.showDirectoryPicker)return toast('Choosing a folder isn’t supported in this view — open the app in its own Chrome or Edge tab, not embedded.');
 try{const handle=await window.showDirectoryPicker({mode:'readwrite'});await fsConnect(handle)}
 catch(e){if(e.name==='SecurityError')toast('This only works when the app is open on its own — not embedded in another page.');
  else if(e.name!=='AbortError')toast('Could not access that folder: '+e.message)}};
$('#fsReconnect').onclick=async()=>{if(!fsHandle)return;
 try{const perm=await fsHandle.requestPermission({mode:'readwrite'});
  if(perm==='granted')await fsConnect(fsHandle);else toast('Permission not granted.')}
 catch(e){toast('Could not reconnect: '+e.message)}};
$('#fsStop').onclick=async()=>{await fsClearHandle();fsHandle=null;usingFolder=false;
 try{localStorage.setItem('journal:entries',JSON.stringify(entries))}catch(e){}
 store=localStore();$('#mode').textContent=store.label;
 $('#fsStop').style.display='none';$('#fsReconnect').style.display='none';$('#fsChoose').textContent='📁 Choose folder…';
 toast('Back to on-device storage — your folder file is untouched.')};

async function init(){
 renderFeed();
 // Open instantly from on-device storage so the app never sits on "Loading…"
 // waiting on a network permission prompt. Sync upgrades quietly in the background.
 store=localStore();$('#mode').textContent=store.label;
 store.sub(async a=>{entries=a;started=true;
  // If this device has already connected OneDrive before and still has a cached
  // sign-in, resolve that FIRST so the real today's page is what appears — showing
  // a blank local placeholder first (then swapping it in later) left a window
  // where typing quickly could create a stray duplicate page instead of
  // continuing the real one.
  const canResumeOD=msalInstance&&localStorage.getItem('journal:onedrive-connected')==='1'&&msalInstance.getAllAccounts().length;
  if(canResumeOD){
   await odAutoInit(); // populates `entries` from OneDrive on success, leaves the local snapshot as-is on failure
   renderFeed();
  }else{
   renderFeed();
   odAutoInit().then(()=>{if(!usingOneDrive)fsInit()});
  }
 });

 try{
  const db=await claude.use('db'),u=await claude.use('user'),id=u&&await u.id();
  try{dl=await claude.use('downloads')}catch(e){}
  if(!db||!id)return;
  const base='data/users/'+id+'/entries',before=entries.slice();
  const dbStore={label:'Synced privately to your account — same data on phone and desktop',
   sub(cb){db.collection(base).onSnapshot(s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),()=>toast('Sync error — changes are only saved on this device for now'))},
   save:e=>db.doc(base+'/'+e.id).set(e),del:i=>db.doc(base+'/'+i).delete()};
  let migrated=false;
  dbStore.sub(a=>{if(usingFolder||usingOneDrive)return;entries=a;store=dbStore;$('#mode').textContent=dbStore.label;
   if(!migrated){migrated=true;before.forEach(le=>{if(!entries.some(x=>x.id===le.id))dbStore.save(le).catch(()=>{})})}
   renderFeed()});
 }catch(e){}
}

function years(){return[...new Set(entries.map(e=>(e.date||'').slice(0,4)).filter(Boolean))].sort().reverse()}
function logPaths(){const s=new Set();entries.forEach(e=>{const p=(e.log||'').split('/').map(x=>x.trim()).filter(Boolean);p.forEach((_,i)=>s.add(p.slice(0,i+1).join(' / ')))});return[...s].sort()}
function fill(sel,first,opts){const v=sel.value;sel.innerHTML=`<option value="">${first}</option>`+opts.map(o=>`<option>${o}</option>`).join('');sel.value=opts.includes(v)?v:''}
function searching(){return!!($('#q').value.trim()||$('#fy').value||$('#fl').value||$('#ft').value)}
function filtered(){const w=$('#q').value.toLowerCase().split(/\s+/).filter(Boolean),y=$('#fy').value,l=$('#fl').value,t=$('#ft').value;
 return entries.filter(e=>{
  if(y&&!(e.date||'').startsWith(y))return false;
  if(t&&e.type!==t)return false;
  if(l){const p=(e.log||'').split('/').map(x=>x.trim()).filter(Boolean).join(' / ');if(!(p===l||p.startsWith(l+' / ')))return false}
  const h=((e.log||'')+' '+(e.date||'')+' '+plain(e.body)).toLowerCase();
  return w.every(x=>h.includes(x))
 }).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||b.ts||0)-(a.created||a.ts||0))}
function preview(e){const d=document.createElement('div');d.innerHTML=e.body||'';d.querySelectorAll('.ts').forEach(x=>x.remove());return[...d.childNodes].map(x=>x.textContent).join(' ').replace(/\s+/g,' ').trim()}
function todayEntry(){return entries.filter(e=>e.daily&&e.date===today()).sort((a,b)=>(a.created||0)-(b.created||0))[0]}

let feedLimit=20;
function feedList(){
 if(searching())return filtered();
 let list=entries.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.created||b.ts||0)-(a.created||a.ts||0));
 if(!todayEntry())list=[{id:phId(),date:today(),type:'entry',daily:true,created:Date.now(),body:''},...list];
 return list.slice(0,feedLimit)}
function feedTotal(){return searching()?filtered().length:Math.max(entries.length+(todayEntry()?0:1),1)}

function fmtDate(d){return new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}
function badgeText(e){return[e.type!=='entry'?e.type+(e.when?' '+e.when.replace('T',' '):''):'',e.log].filter(Boolean).join(' · ')}

function createCard(e){
 const root=document.createElement('div');root.className='jcard';root.dataset.id=e.id;
 root.innerHTML=`<div class="jhead"><span class="jdate"></span><span class="jbadge"></span></div>
  <div class="jbody" contenteditable="true" spellcheck="true"></div>
  <details><summary class="small">Details: date, appointment / reminder, log</summary>
   <div class="row" style="margin-top:8px">
    <input class="f-date" type="date"><select class="f-type"><option value="entry">Entry</option><option value="appointment">Appointment</option><option value="reminder">Reminder</option></select>
    <input class="f-when" type="datetime-local"><input class="f-log grow" list="logs" placeholder="Log, e.g. Health / Medication">
    <label class="small"><input class="f-done" type="checkbox"> Done</label>
   </div>
  </details>
  <div class="jfoot"><span class="jstatus small">Saves automatically as you write</span><button class="f-del">Delete</button></div>`;
 const body=root.querySelector('.jbody');
 const fDate=root.querySelector('.f-date'),fType=root.querySelector('.f-type'),fWhen=root.querySelector('.f-when'),fLog=root.querySelector('.f-log'),fDone=root.querySelector('.f-done');
 const rec={root,body,headEl:root.querySelector('.jdate'),badgeEl:root.querySelector('.jbadge'),statusEl:root.querySelector('.jstatus'),fDate,fType,fWhen,fLog,fDone};
 fDate.value=e.date||today();fType.value=e.type||'entry';fWhen.value=e.when||'';fLog.value=e.log||'';fDone.checked=!!e.done;
 body.innerHTML=e.body||'';
 syncDetailVisibility(rec);
 rec.headEl.textContent=fmtDate(fDate.value);
 rec.badgeEl.textContent=badgeText(e);

 body.addEventListener('focus',()=>{activeId=e.id;$('#toolbar').classList.add('show');
  const isToday=fDate.value===today()&&fType.value==='entry';
  if(isToday&&(!lastActivityByCard[e.id]||Date.now()-lastActivityByCard[e.id]>3e5))stampCard(rec,e.id);
  lastActivityByCard[e.id]=Date.now()});
 body.addEventListener('blur',()=>{commitSave(e.id);setTimeout(()=>{if(!document.activeElement||!document.activeElement.closest('.jbody'))$('#toolbar').classList.remove('show')},120)});
 body.addEventListener('input',()=>scheduleSave(e.id));
 [fDate,fType,fWhen,fLog,fDone].forEach(inp=>inp.addEventListener('input',()=>{syncDetailVisibility(rec);rec.headEl.textContent=fmtDate(fDate.value);scheduleSave(e.id)}));
 root.querySelector('.f-del').onclick=()=>{if(!confirm('Delete this entry permanently?'))return;
  entries=entries.filter(x=>x.id!==e.id);store.del(e.id);cardEls.delete(e.id);root.remove();renderUpcoming()};
 return rec}

function syncDetailVisibility(rec){const a=rec.fType.value!=='entry';rec.fWhen.style.display=a?'':'none';rec.fDone.parentElement.style.display=a?'':'none'}

function updateCardChrome(rec,e){
 if(document.activeElement!==rec.body){
  rec.fDate.value=e.date||today();rec.fType.value=e.type||'entry';rec.fWhen.value=e.when||'';rec.fLog.value=e.log||'';rec.fDone.checked=!!e.done;
  syncDetailVisibility(rec);
  if(rec.body.innerHTML!==(e.body||''))rec.body.innerHTML=e.body||'';
 }
 rec.headEl.textContent=fmtDate(rec.fDate.value);
 rec.badgeEl.textContent=badgeText(e);
}

function renderFeed(){
 fill($('#fy'),'All years',years());fill($('#fl'),'All logs',logPaths());
 $('#logs')&&($('#logs').innerHTML=logPaths().map(o=>`<option value="${o}">`).join(''));
 const list=feedList(),feed=$('#feed'),wantedIds=new Set(list.map(e=>e.id));
 for(const[id,rec]of cardEls){if(!wantedIds.has(id)){rec.root.remove();cardEls.delete(id)}}
 let prevNode=null;
 list.forEach(e=>{let rec=cardEls.get(e.id);
  if(!rec){rec=createCard(e);cardEls.set(e.id,rec)}else{updateCardChrome(rec,e)}
  const wantAfter=prevNode?prevNode.nextSibling:feed.firstChild;
  if(wantAfter!==rec.root)feed.insertBefore(rec.root,wantAfter);
  prevNode=rec.root});
 let more=$('#loadMore');
 if(!searching()&&feedLimit<feedTotal()){
  if(!more){more=document.createElement('button');more.id='loadMore';more.textContent='Load earlier entries';more.onclick=()=>{feedLimit+=20;renderFeed()};feed.appendChild(more)}
  else feed.appendChild(more);
 }else if(more)more.remove();
 if(!list.length){feed.querySelectorAll('.jempty').forEach(x=>x.remove());
  const em=document.createElement('div');em.className='jempty';em.textContent=searching()?'No matching entries.':'No entries yet.';feed.appendChild(em)}
 else feed.querySelectorAll('.jempty').forEach(x=>x.remove());
 renderUpcoming();
}

function renderUpcoming(){
 const now=new Date(),up=entries.filter(e=>e.type!=='entry'&&!e.done&&e.when).sort((a,b)=>a.when.localeCompare(b.when)).slice(0,5),u=$('#up');u.textContent='';
 if(up.length){const h=document.createElement('b');h.textContent='Upcoming';u.append(h);
  up.forEach(e=>{const r=document.createElement('div');r.className='small';r.style.cursor='pointer';
   r.textContent=(new Date(e.when)<now?'⚠ overdue · ':'')+e.when.replace('T',' ')+' — '+(preview(e).slice(0,40)||e.type);
   r.onclick=()=>{const rec=cardEls.get(e.id);if(rec){rec.root.scrollIntoView({behavior:'smooth',block:'center'});rec.body.focus()}};
   u.append(r)})}
}

function stampCard(rec,id){const b=rec.body;if(!b.textContent.trim())b.innerHTML='';
 while(b.lastElementChild&&(b.lastElementChild.classList.contains('ts')||!b.lastElementChild.textContent.trim()))b.lastElementChild.remove();
 const t=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 b.insertAdjacentHTML('beforeend',(b.innerHTML?'<div><br></div>':'')+'<div class="ts"><b>'+t+'</b></div><div><br></div>');
 const r=document.createRange();r.selectNodeContents(b.lastElementChild);r.collapse(true);const g=getSelection();g.removeAllRanges();g.addRange(r);
 b.lastElementChild.scrollIntoView({block:'center'});scheduleSave(id)}

function scheduleSave(id){cardDirty[id]=true;lastActivityByCard[id]=Date.now();clearTimeout(cardTimers[id]);
 const rec=cardEls.get(id);if(rec)rec.statusEl.textContent='Saving…';
 cardTimers[id]=setTimeout(()=>commitSave(id),8000)}

function commitSave(id){const rec=cardEls.get(id);if(!rec||!cardDirty[id])return;
 clearTimeout(cardTimers[id]);cardDirty[id]=false;
 const i=entries.findIndex(x=>x.id===id);
 const base=i>=0?entries[i]:{id,daily:id===phId(),created:Date.now()};
 const n={...base,date:rec.fDate.value||today(),type:rec.fType.value,when:rec.fType.value==='entry'?'':rec.fWhen.value,
  log:rec.fLog.value.trim(),done:rec.fDone.checked,body:rec.body.innerHTML,ts:Date.now()};
 if(i<0&&!preview(n))return; // never save a genuinely empty placeholder
 if(i<0)entries.push(n);else entries[i]=n;
 rec.badgeEl.textContent=badgeText(n);
 Promise.resolve(store.save(n)).then(()=>{if(cardEls.get(id))cardEls.get(id).statusEl.textContent='Saved '+new Date().toLocaleTimeString()},
  ()=>{if(cardEls.get(id))cardEls.get(id).statusEl.textContent='Save failed'});
 renderUpcoming()}

function flushAll(){for(const id of Object.keys(cardDirty))if(cardDirty[id])commitSave(id)}

document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now();flushAll()}
 else if(hiddenAt&&Date.now()-hiddenAt>18e5){flushAll();renderFeed()}});
addEventListener('pagehide',flushAll);
$('#today').onclick=()=>{flushAll();feedLimit=20;$('#q').value='';$('#fy').value='';$('#fl').value='';$('#ft').value='';$('#filters').classList.remove('show');renderFeed();
 const t=cardEls.get(todayEntry()?todayEntry().id:phId());if(t){t.root.scrollIntoView({block:'start'});t.body.focus()}};
$('#q').addEventListener('input',()=>{$('#filters').classList.toggle('show',!!$('#q').value.trim());feedLimit=20;renderFeed()});
['#fy','#fl','#ft'].forEach(s=>$(s).addEventListener('input',()=>{feedLimit=20;renderFeed()}));
document.querySelectorAll('#toolbar [data-c]').forEach(b=>{b.onmousedown=e=>e.preventDefault();
 b.onclick=()=>{document.execCommand(b.dataset.c,false,b.dataset.v||null);if(activeId)scheduleSave(activeId)}});

$('#mic').onclick=()=>{const R=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!R)return toast('Dictation isn’t available in this browser — use the microphone key on your keyboard.');
 if(window.__rec){window.__rec.stop();return}
 const rec=new R();window.__rec=rec;rec.continuous=true;rec.interimResults=false;rec.lang=navigator.language||'en-US';
 rec.onresult=ev=>{for(let i=ev.resultIndex;i<ev.results.length;i++)if(ev.results[i].isFinal){document.execCommand('insertText',false,ev.results[i][0].transcript+' ');if(activeId)scheduleSave(activeId)}};
 rec.onerror=ev=>{toast('Dictation blocked or unavailable ('+ev.error+'). The keyboard mic key still works.')};
 rec.onend=()=>{window.__rec=null;$('#mic').textContent='🎤 Dictate'};
 try{rec.start();$('#mic').textContent='⏹ Stop'}catch(e){window.__rec=null}};

$('#settingsToggle').onclick=()=>$('#settingsPanel').classList.add('show');
$('#settingsClose').onclick=()=>$('#settingsPanel').classList.remove('show');
$('#settingsPanel').addEventListener('click',ev=>{if(ev.target.id==='settingsPanel')$('#settingsPanel').classList.remove('show')});

/* ---- Word export (.docx built in the page) ---- */
async function offerFile(filename,blob){
 if(dl){try{await dl.save({filename,data:blob});toast('Saved '+filename)}catch(e){if(e.code!=='declined')toast('Save failed: '+(e.code||e.message))}return}
 try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Downloaded '+filename)}
 catch(e){toast('Download failed: '+e.message)}}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const run=(t,f={})=>`<w:r><w:rPr>${f.b?'<w:b/>':''}${f.i?'<w:i/>':''}${f.u?'<w:u w:val="single"/>':''}${f.sz?`<w:sz w:val="${f.sz}"/>`:''}</w:rPr><w:t xml:space="preserve">${esc(t)}</w:t></w:r>`;
const para=r=>`<w:p>${r}</w:p>`;
function runs(nodes,f){let o='';nodes.forEach(c=>{
 if(c.nodeType===3)o+=run(c.textContent,f);
 else if(c.nodeName==='BR')o+='<w:r><w:br/></w:r>';
 else{const t=c.nodeName,g={...f};if(/^(B|STRONG|H\d)$/.test(t))g.b=1;if(/^(I|EM)$/.test(t))g.i=1;if(t==='U')g.u=1;o+=runs([...c.childNodes],g)}});return o}
function paras(html){const d=document.createElement('div');d.innerHTML=html||'';let o='',buf=[];
 const flush=()=>{if(buf.length){o+=para(runs(buf,{}));buf=[]}};
 [...d.childNodes].forEach(c=>{
  if(c.nodeType===3||/^(B|I|U|STRONG|EM|SPAN|A|BR)$/.test(c.nodeName))buf.push(c);
  else if(/^(UL|OL)$/.test(c.nodeName)){flush();c.querySelectorAll('li').forEach(li=>o+=para(run('•  ')+runs([...li.childNodes],{})))}
  else{flush();o+=para(runs([...c.childNodes],/^H\d/.test(c.nodeName)?{b:1}:{}))}});
 flush();return o}
async function makeDocx(list,name){
 const body=list.map(e=>para(run(preview(e).slice(0,80)||'(untitled)',{b:1,sz:30}))+para(run([e.date,e.type!=='entry'?e.type+(e.when?' '+e.when.replace('T',' '):''):'',e.log].filter(Boolean).join('  ·  '),{i:1,sz:20}))+paras(e.body)+para('')).join('')
  ||para(run('No entries.'));
 const z=new JSZip(),W='http://schemas.openxmlformats.org/';
 z.file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8"?><Types xmlns="${W}package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
 z.file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="${W}package/2006/relationships"><Relationship Id="rId1" Type="${W}officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
 z.file('word/document.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}wordprocessingml/2006/main"><w:body>${body}</w:body></w:document>`);
 const blob=await z.generateAsync({type:'blob'});
 await offerFile(name+'.docx',blob)}
$('#xb').onclick=()=>{const s=$('#xs').value;let l,n='Journal';
 if(s==='one'){if(!activeId)return toast('Tap into an entry first, then export it.');flushAll();
  const e=entries.find(x=>x.id===activeId);if(!e)return toast('That entry hasn’t been saved yet — write something first.');
  l=[e];n=(preview(e).slice(0,40)||e.date||'Entry').replace(/[^\w -]/g,'')}
 else if(s==='all'){l=[...entries].sort((a,b)=>(a.date||'').localeCompare(b.date||''));n='Journal-all'}
 else{l=filtered().reverse();n='Journal-'+([$('#fy').value,$('#fl').value.replace(/[^\w]+/g,'-')].filter(Boolean).join('-')||'view')}
 makeDocx(l,n)};

$('#bk').onclick=async()=>{flushAll();const blob=new Blob([JSON.stringify({app:'journal',version:1,exported:new Date().toISOString(),entries},null,0)],{type:'application/json'});
 await offerFile('journal-backup-'+today()+'.json',blob)};
$('#rs').onclick=()=>$('#rsf').click();
$('#rsf').addEventListener('change',async()=>{const f=$('#rsf').files[0];if(!f)return;$('#rsf').value='';
 let data;try{data=JSON.parse(await f.text())}catch(e){return toast('That file isn’t a valid backup.')}
 const list=Array.isArray(data)?data:Array.isArray(data.entries)?data.entries:null;
 if(!list)return toast('That file isn’t a valid backup.');
 if(!confirm('Restore '+list.length+' entries from this backup? Entries with the same id will be overwritten; nothing else is deleted.'))return;
 for(const e of list){if(!e||!e.id)continue;const i=entries.findIndex(x=>x.id===e.id);if(i<0)entries.push(e);else entries[i]=e;try{await store.save(e)}catch(err){}}
 renderFeed();toast('Restored '+list.length+' entries')});

setInterval(()=>{const now=new Date();entries.forEach(e=>{if(e.type!=='entry'&&!e.done&&e.when&&new Date(e.when)<=now&&!alerted.has(e.id)){alerted.add(e.id);toast('⏰ '+(preview(e).slice(0,40)||e.type),12000)}})},30000);
init();
</script></body></html>
